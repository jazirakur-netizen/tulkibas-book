name: Prepare website files
on:
  push:
    paths:
      - .github/workflows/unpack-site.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract complete website
        run: |
          python3 - <<'PYCODE'
          from zipfile import ZipFile
          from pathlib import Path
          for name in ('site-part-1.zip', 'site-part-2.zip'):
              with ZipFile(name) as archive:
                  archive.extractall('.')
              Path(name).unlink()
          PYCODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish complete Tulkibas website"
          git push
