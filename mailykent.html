<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Майлыкенттегі патша озбырлығы</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#38604a,#0d2c25 75%);color:#f3e6c9;font-family:Georgia,serif;min-height:100vh}header{max-width:1200px;margin:auto;padding:22px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}a{color:#ecd29a}h1{font-size:clamp(18px,2.4vw,26px);margin:8px 0;max-width:800px}.reader{max-width:1200px;margin:0 auto 25px;padding:0 15px}.spread{margin:0;perspective:1600px;position:relative;min-height:220px}.spread img{display:block;width:100%;height:auto;box-shadow:0 20px 55px #001b16b3;border:1px solid #cdb380;border-radius:3px 10px 10px 3px;background:#fff;animation:turn .3s ease-out}.controls{display:flex;align-items:center;justify-content:center;gap:18px;margin:22px 0;flex-wrap:wrap}button,select{font:inherit;padding:12px 20px;border:1px solid #c2a465;border-radius:10px;background:#f5e9c9;color:#183a2c;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #e7be69;outline-offset:4px}.note{text-align:center;font:13px system-ui;line-height:1.7;color:#d9d9bf}.zoom{display:block;text-align:center;font:14px system-ui;margin:15px}@keyframes turn{from{opacity:.6;transform:rotateY(-5deg)}to{opacity:1;transform:rotateY(0)}}@media(prefers-reduced-motion:reduce){.spread img{animation:none}}</style></head><body><header><div><a href="index.html#kids">← Балалар кітапханасы</a><h1>Майлыкенттегі патша озбырлығы</h1><span>Автор: Алимансұр</span></div><a href="assets/mailykent/original.pdf" target="_blank" rel="noopener">PDF нұсқасын ашу ↗</a></header><main class="reader"><div class="controls"><button id="prev">← Алдыңғы</button><label>Бет <select id="page" aria-label="Бетті таңдау"></select></label><button id="next">Келесі →</button></div><figure class="spread"><img id="spread" alt="" width="1500" height="1159"></figure><a class="zoom" id="zoom" target="_blank" rel="noopener">Суретті үлкейтіп ашу ↗</a><p class="note" role="status" id="status"></p><p class="note">Пернетақтадағы ← → пернелерімен де парақтауға болады. Телефонды көлденең бұрсаңыз, оқу ыңғайлырақ.</p></main><script>const count=10,select=document.querySelector('#page'),img=document.querySelector('#spread');let current=1;try{const n=Number(localStorage.getItem('mailykent-page'));if(n>=1&&n<=count)current=n}catch{}select.innerHTML=Array.from({length:count},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+' / '+count+'</option>').join('');function show(n){current=Math.max(1,Math.min(count,n));const src='assets/mailykent/page-'+String(current).padStart(2,'0')+'.webp';img.src=src;img.alt='Майлыкенттегі патша озбырлығы кітабы, '+current+'-бет';select.value=current;document.querySelector('#prev').disabled=current===1;document.querySelector('#next').disabled=current===count;document.querySelector('#zoom').href=src;document.querySelector('#status').textContent=current+' / '+count+' бет';try{localStorage.setItem('mailykent-page',current)}catch{}if(current<count){const pre=new Image();pre.src='assets/mailykent/page-'+String(current+1).padStart(2,'0')+'.webp'}}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);select.onchange=()=>show(Number(select.value));document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}});show(current);</script></body></html>
